[workspace]
authors = ["Fred Thomas <fred.thomas@eci.ox.ac.uk>"]
channels = ["conda-forge"]
name = "malkus"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12"
geopandas = "*"
numpy = "*"
numba = "*"
pandas = "*"
pyarrow = "*"
xarray = "*"
zarr = ">=2.18,<3"
rasterio = "*"
rioxarray = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
malkus = { path = ".", editable = true }
